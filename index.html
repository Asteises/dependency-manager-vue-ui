<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Dependency Manager</title>

    <!-- Опционально: системные шрифты для быстрой первой отрисовки -->
    <style>
        /* Небольшой «reset» и базовые токены темы */
        :root {
            --bg: #f6f9fc;
            --fg: #1f2937;
            --border: #e5e7eb;
            --accent: #0ea5e9;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1220;
                --fg: #e5e7eb;
                --border: #1f2937;
                --accent: #38bdf8;
            }
        }

        html,
        body,
        #app {
            height: 100%;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
            "Apple Color Emoji", "Segoe UI Emoji";
            line-height: 1.5;
            text-rendering: optimizeLegibility;
        }

        /* Поддержка «сейф-зоны» на iOS (отрез экрана) */
        #app {
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* На случай FOUC до загрузки стилей приложения */
        .no-js {
            display: none;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Простой прелоадер до инициализации Vue -->
    <noscript>Требуется JavaScript для запуска приложения.</noscript>
    <div class="no-js">Загрузка…</div>
</div>

<!-- Vite подключает модульную точку входа -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
